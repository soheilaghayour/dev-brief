packages:
  - apps/*
  - packages/*
catalog:
  typescript: ~6.0.3
  zod: 3.25.76
allowBuilds:
  '@prisma/engines': true
  # swagger-ui-dist's install-time telemetry; nothing needs it
  '@scarf/scarf': false
  # downloads the sentry-cli binary that uploads source maps
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  prisma: true
overrides:
  zod: 'catalog:'
  # Better Auth is written against the Zod 4 API; the app code stays on the pinned 3.25.
  better-auth>zod: ^4.5.4
  '@better-auth/core>zod': ^4.5.4
  better-call>zod: ^4.5.4
  # Better Auth's Prisma adapter puts the Prisma CLI in the prod graph; its effect 3.20 has GHSA-7589-6fvf-x4pw.
  '@prisma/config>effect': ^3.22.1
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
