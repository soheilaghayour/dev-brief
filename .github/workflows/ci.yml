name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: devbrief
          POSTGRES_PASSWORD: devbrief
          POSTGRES_DB: devbrief
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devbrief"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      API_INTERNAL_URL: http://localhost:3001
      INTERNAL_API_TOKEN: ci-internal-token-0123
      DATABASE_URL: postgresql://devbrief:devbrief@localhost:5432/devbrief
      DATABASE_URL_TEST: postgresql://devbrief:devbrief@localhost:5432/devbrief
      BETTER_AUTH_SECRET: ci-better-auth-secret-0123456789abcdef
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter api db:deploy
      - name: Schema matches migrations (no drift)
        run: pnpm --filter api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm test
      - run: pnpm --filter @devbrief/shared --filter api build
      - run: pnpm --filter api db:seed
      - run: pnpm --filter api db:seed:e2e
        env:
          ALLOW_DESTRUCTIVE_SEED: '1'
      # The landing page is generated from live stories at build time, so the API runs during the web build and the e2e run.
      - name: Start the API
        run: |
          nohup pnpm --filter api start > api.log 2>&1 &
          curl --fail --silent --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3001/api/v1/health
        env:
          AUTH_TEST_MODE: 'true'
      - run: pnpm --filter web build
        env:
          API_PROXY_URL: http://localhost:3001
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # After e2e, so a size overrun does not hide a failing smoke test.
      - run: pnpm --filter web size

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
      # Nothing listens here, so the build renders the landing page from its fixture.
      API_INTERNAL_URL: http://localhost:3001
      INTERNAL_API_TOKEN: ci-internal-token-0123
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @devbrief/shared --filter web build
      - run: npx -y @lhci/cli@0.15.1 autorun --config=lighthouserc.json

  images:
    name: images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      # Build only: Coolify builds and runs the images on the VPS, so no registry is involved.
      - run: docker build -f apps/${{ matrix.app }}/Dockerfile -t devbrief-${{ matrix.app }}:ci .
      # The image must carry the schema engine, so a deploy never downloads it.
      - if: matrix.app == 'api'
        run: docker run --rm --network none --entrypoint sh devbrief-api:ci -c 'ls node_modules/.pnpm/node_modules/@prisma/engines/schema-engine-*'
